# ==============================================================================
# 项目代码硬编码解耦集中配置 (config.toml) - 随代码提交入库
#
# 遵循 Agent Relay Hygiene 规范：
# - 唯一职责：代码硬编码解耦专用，集中承载所有非敏感的工程与业务参数
# - 包含：服务拓扑、运行旋钮、超时重试、资产路径、特性开关等
# - 严禁存放任何敏感密钥与凭据 (敏感项留空或通过本地 .env 注入)
# ==============================================================================

[app]
name = "coding-tools-mcp"
version = "0.5.0-unconfined"
environment = "production"

[server]
host = "127.0.0.1"
port = 8000
transport = "http"

[features]
unconfined = true
enable_view_image = true
oauth_mode = true
permission_mode = "dangerous"
workspace_mutation = "unrestricted"

[runtime]
timeout = 60.0
max_retries = 3
